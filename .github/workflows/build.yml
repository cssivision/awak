name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Test (release)
        # The stress tests in `tests/stress.rs` and the executor unit tests are
        # timing sensitive: a lost task or a missed wake-up is far easier to
        # trigger when optimizations are on, so run them in release too.
        run: cargo test --release --verbose

      - name: Test (edge-triggered)
        # The edge-triggered poller uses different kernel flags (`EPOLLET` /
        # `EV_CLEAR`), so it needs its own run.
        run: cargo test --release --features edge-triggered --verbose

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt --check
        run: cargo fmt --all -- --check
