[package]
name = "awak"
version = "0.2.41"
authors = ["cssivision <cssivision@gmail.com>"]
license = "MIT"
repository = "https://github.com/cssivision/awak"
homepage = "https://github.com/cssivision/awak"
description = "A small async runtime for Rust"
edition = "2018"

[features]
default = []
# Report readiness with edge-triggered semantics (`EPOLLET` on Linux/Android,
# `EV_CLEAR` on macOS/BSD) instead of one-shot registrations.
edge-triggered = []

[dependencies]
async-task = "4.7"
rand = "0.10"
libc = "0.2"
slab = "0.4"
socket2 = { version = "0.6", features = ["all"] }
cfg-if = "1"
pin-project-lite = "0.2"
futures-io = "0.3"
futures-core = "0.3"
thread_local = "1.1"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["io"] }
